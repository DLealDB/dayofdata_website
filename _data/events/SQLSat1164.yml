sponsorplan: |
  <h1><a name="sponsorship">Sponsorship Plan</a></h1>
  <p><strong>Confirmed Community Sponsors: Neo4j - $250; Community Foundation for Southeast Michigan - $250.</strong></p>
  <p>Sponsors help support free technical education, speaker support, attendee food and beverages, event materials, and community engagement for Day of Data Detroit 2026.</p>
  <p>Conference admission is completely free. A separate optional $15 lunch ticket is available for attendees who want the event-provided lunch.</p>
  <p>Organizations working with SQL Server, Azure SQL, Microsoft Fabric, Power BI, Azure Data &amp; AI, Databricks, streaming, data engineering, analytics, AI, cloud, governance, security, developer tools, recruiting, and related technologies are especially encouraged to participate.</p>
  <h2>Sponsorship Levels</h2>
  <p>All sponsors will be recognized on the Day of Data Detroit event page and during the event. We also welcome useful in-kind contributions such as food support, gift cards, raffle items, software, training, or speaker support.</p>
