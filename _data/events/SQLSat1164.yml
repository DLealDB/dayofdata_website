description: | 
    <p>Day of Data Detroit 2026 will be a free, community-driven, in-person data and AI event serving Detroit, Southeast Michigan, and the broader Michigan technology community.</p>
    <p>We are planning for approximately 100 attendees, bringing together data professionals, developers, architects, analysts, AI practitioners, students, technology leaders, and community members for technical learning, knowledge sharing, networking, and professional development.</p>
    <p>Topics may include SQL Server, Azure SQL Database, Microsoft Fabric, Power BI, Azure Data and AI, Databricks, data engineering, real-time analytics, business intelligence, data architecture, data governance, generative AI, AI agents, machine learning, and related data platform technologies.</p>
    <p>Sessions will feature local and regional community speakers and industry practitioners. Venue, attendee registration, speaker, and schedule details will be added as they are finalized.</p>

