sponsorplan: |
  <h1><a name="sponsorship">Sponsorship Plan</a></h1>
  <p>Sponsors are very important to Day of Data Detroit 2026. Sponsorship helps us keep attendance free and supports a community event for data professionals, developers, architects, analysts, AI practitioners, students, and technology leaders across Detroit and Southeast Michigan.</p>
  <p>Organizations working with SQL Server, Azure SQL Database, SQL Server on Azure VMs, Microsoft Fabric, Power BI, Azure Data and AI, Databricks, data engineering, analytics, AI, and related technologies are especially encouraged to participate.</p>
  <h2>Sponsorship Levels</h2>
  <p>All sponsors will be recognized on the Day of Data Detroit event page and during the event. We are also happy to discuss in-kind sponsorships such as food, beverages, attendee giveaways, raffle prizes, speaker gifts, printing, or other event support.</p>
  <ul>
    <li><b>Community Sponsor ($250)</b> - Company logo on the event page, official sponsor recognition, verbal recognition during the event, and the opportunity to provide branded giveaways, raffle items, or recruiting materials.</li>
    <li><b>Supporting Sponsor ($500)</b> - Includes Community Sponsor benefits plus more prominent sponsor recognition, recognition in selected event communications and social media, and the opportunity to provide recruiting or technology-community information for attendees.</li>
    <li><b>Premier Sponsor ($1,000)</b> - Includes Supporting Sponsor benefits plus premier placement on the event page, prominent recognition during opening and closing announcements, and enhanced visibility to the Detroit and Southeast Michigan data community.</li>
  </ul>
  <h2>In-Kind Sponsorship</h2>
  <p>We also welcome in-kind support for attendee lunch, water and snacks, speaker dinner, speaker gifts, event materials, printing, attendee giveaways, and raffle prizes.</p>
  <p>If your organization requires a nonprofit invoice or sponsorship receipt, please contact the organizer so sponsorship processing through SQL Saturday Corporation can be coordinated.</p>
  <p>For sponsorship opportunities, please email <a href="mailto:mouraksh@umich.edu">Mou Rakshit</a>.</p>
